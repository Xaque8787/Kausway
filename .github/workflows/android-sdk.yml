name: Android SDK
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  aar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Release version
        id: version
        run: |
          version=$(bash scripts/ci/check-version.sh --track client)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
      - name: Toolchains
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          cargo +1.99.1 install cargo-ndk --version 4.1.2 --locked
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sdk-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'sdks/android/**/*.gradle.kts', 'examples/android-basic/*.gradle.kts', 'sdks/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: sdk-${{ runner.os }}-
      - name: Emulator invitation fixture tests
        run: python3 -m unittest discover -s scripts/android -p 'test_*.py'
      - name: Rust tests and lint
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --locked -p kausway-host --bins
          bash ../scripts/ci/e2e.sh target/debug
      - name: Build and inspect AAR
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash scripts/android/build-aar.sh
      - name: Independent AAR consumer compiles
        working-directory: sdks/android
        run: ./gradlew :sample:assembleDebug :kausway-client:assembleDebugAndroidTest
      - name: Stage SDK development artifact and provenance
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-development/native" "$RUNNER_TEMP/sdk-development/sample"
          cp dist/kausway-client-android-"$VERSION".* "$RUNNER_TEMP/sdk-development/"
          cp -R sdks/android/kausway-client/src/main/jniLibs/. "$RUNNER_TEMP/sdk-development/native/"
          cp examples/android-basic/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/sdk-development/sample/"
          python3 scripts/ci/artifact-manifest.py --directory "$RUNNER_TEMP/sdk-development" \
            --kind android-sdk --target android-arm64-armv7-x86_64 --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: android-sdk-development-${{ steps.version.outputs.version }}-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-development/*
          retention-days: 14
          if-no-files-found: error
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android JNI lifecycle and real-host Range test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/android/emulator-e2e.sh
      # Candidate payload is uploaded only after the emulator test succeeds.
      - name: Stage validated SDK candidate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-candidate"
          cp dist/kausway-client-android-"$VERSION".* "$RUNNER_TEMP/sdk-candidate/"
          python3 scripts/ci/artifact-manifest.py --directory "$RUNNER_TEMP/sdk-candidate" \
            --kind android-sdk --target android-arm64-armv7-x86_64 --commit "$GITHUB_SHA"
      - name: Upload validated SDK assets
        uses: actions/upload-artifact@v4
        with:
          name: kausway-android-sdk-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-candidate/*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-sdk-test-results-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            sdks/android/kausway-client/build/reports/androidTests/
            sdks/android/kausway-client/build/outputs/androidTest-results/
            dist/android-emulator-diagnostics/
