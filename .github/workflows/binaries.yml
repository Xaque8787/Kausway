name: Binaries

# Publishes a GitHub Release either when a tag such as v0.4.0 is pushed, or when the workflow is
# run manually with "publish" ticked, in which case the tag is created from the project version.
# A manual run without "publish" only builds downloadable artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release tagged v<project version> from this commit
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"
  # getifaddrs, used for network interface discovery, needs API 24.
  ANDROID_API: "24"

jobs:
  version:
    name: Version check
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      client_version: ${{ steps.check.outputs.client_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: All versions agree with each other and the tag
        id: check
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(bash scripts/ci/check-version.sh "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "client_version=$(bash scripts/ci/check-version.sh --track client)" >> "$GITHUB_OUTPUT"

      - name: Release tags must belong to the default branch
        if: github.ref_type == 'tag'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"

      # Fails before any building, so a version that was already released is never overwritten.
      - name: Manual publish is allowed
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          VERSION: ${{ steps.check.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publishing is only allowed from the $DEFAULT_BRANCH branch."
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "::error::v$VERSION is already released. Raise the version (see README, Making a release) and run again."
            exit 1
          fi

  linux:
    name: Linux ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup override set "$RUST_TOOLCHAIN"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: bin-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: bin-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-

      # Static musl binaries run on any Linux distribution regardless of its glibc version.
      - name: Build
        env:
          CC: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p kausway-host --bins

      - name: Binaries are static and report the release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CLIENT_VERSION: ${{ needs.version.outputs.client_version }}
        run: |
          set -eux
          dir=target/${{ matrix.target }}/release
          for b in kausway-host kausway-test-client; do
            file "$dir/$b" | grep -Eq 'statically linked|static-pie linked'
            expected="$VERSION"
            if [ "$b" = kausway-test-client ]; then expected="$CLIENT_VERSION"; fi
            test "$("$dir/$b" --version)" = "$b $expected"
          done

      - name: End-to-end test with the release binaries
        timeout-minutes: 5
        run: bash ../scripts/ci/e2e.sh target/${{ matrix.target }}/release

      - name: Package
        run: bash ../scripts/packaging/package-binaries.sh target/${{ matrix.target }}/release ${{ matrix.target }} "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: kausway-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  android:
    name: Android ${{ matrix.abi }}
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          # Many Android TV devices run a 32-bit userland even on 64-bit chips.
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup override set "$RUST_TOOLCHAIN"
          cargo install cargo-ndk --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: bin-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: bin-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Build
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t ${{ matrix.abi }} -P "$ANDROID_API" build --release --locked -p kausway-host --bins

      - name: Package
        run: |
          file target/${{ matrix.target }}/release/kausway-test-client
          bash ../scripts/packaging/package-binaries.sh target/${{ matrix.target }}/release android-${{ matrix.abi }} "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: kausway-android-${{ matrix.abi }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  plugin:
    name: Jellyfin plugin
    needs: version
    runs-on: ubuntu-24.04
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: integrations/jellyfin/global.json

      - name: Test
        run: dotnet test integrations/jellyfin/tests/Jellyfin.Plugin.Kausway.Tests.csproj -c Release

      # The zip holds the JellyfinKausway_<version> folder that goes into Jellyfin's plugins directory.
      - name: Build and package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eux
          dotnet publish integrations/jellyfin/plugin/Jellyfin.Plugin.Kausway.csproj -c Release -o "$RUNNER_TEMP/publish"
          sh scripts/packaging/package-plugin.sh "$RUNNER_TEMP/publish" integrations/jellyfin/meta.json "$RUNNER_TEMP/plugin"
          name="kausway-$VERSION-jellyfin-plugin.zip"
          mkdir -p "$RUNNER_TEMP/dist"
          (cd "$RUNNER_TEMP/plugin" && zip -r "$RUNNER_TEMP/dist/$name" .)
          (cd "$RUNNER_TEMP/dist" && sha256sum "$name" > "$name.sha256")
          unzip -l "$RUNNER_TEMP/dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: kausway-jellyfin-plugin
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  sdk:
    name: Android SDK and emulator validation
    needs: version
    uses: ./.github/workflows/android-sdk.yml

  release:
    name: Publish release
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [version, linux, android, plugin, sdk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          # Development SDK artifacts have a separate prefix and are excluded.
          pattern: kausway-*
          path: dist
          merge-multiple: true

      - name: Verify checksums and write SHA256SUMS
        working-directory: dist
        run: |
          set -eux
          sha256sum -c ./*.sha256
          cat ./*.sha256 | sort -k 2 > SHA256SUMS
          ls -l

      - name: SDK release assets are present
        env:
          VERSION: ${{ needs.version.outputs.client_version }}
        run: |
          test -s "dist/kausway-client-android-$VERSION.aar"
          test -s "dist/kausway-client-android-$VERSION.pom"

      - name: Create release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
        run: |
          # A pushed tag must already exist; a manual publish creates it on the commit that was built.
          tag_args=(--verify-tag)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then tag_args=(--target "$GITHUB_SHA"); fi
          prerelease=()
          if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
          # Upload only flat release payloads, never directories or development outputs.
          shopt -s nullglob
          assets=(./*.tar.gz ./*.zip ./*.aar ./*.pom ./*.jar ./kausway-client-android-*-README.md ./*.sha256 ./SHA256SUMS)
          for asset in "${assets[@]}"; do
            test -f "$asset" || { echo "::error::Missing release asset: $asset"; exit 1; }
          done
          gh release create "$TAG" "${assets[@]}" \
            "${tag_args[@]}" \
            --title "$TAG" \
            --generate-notes \
            "${prerelease[@]}"
