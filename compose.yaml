# Jellyfin + kausway-host, built from this repository: docker compose up -d --build
# Data lives next to this file: ./config (Jellyfin), ./cache, ./media (your library, read-only),
# ./kausway-data (Iroh identity, paired devices, control token). Back up ./config and ./kausway-data.
name: kausway

services:
  jellyfin:
    build: .
    image: kausway:local
    init: true
    restart: unless-stopped
    ports:
      - "8096:8096"
    # Host networking avoids Docker's extra NAT layer and can improve direct P2P rates on Linux.
    # If you enable it, remove "ports" above.
    # network_mode: host
    environment:
      # auto | relay_only | p2p_only. When set, overrides the policy saved from the dashboard.
      # KAUSWAY_TRANSPORT_POLICY: auto
      # A custom relay URL, or "none" to disable relays (direct connections only).
      # KAUSWAY_RELAY_URL: https://relay.example.com
      # on | off. Forward WebSocket connections. When set, overrides the dashboard setting.
      # KAUSWAY_WEBSOCKETS: "on"
      # rewrite | pass_through. Origin header sent to the server on WebSocket connections.
      # KAUSWAY_WEBSOCKET_ORIGIN: rewrite
      RUST_LOG: info,iroh=warn,noq=warn,kausway_host=info,kausway_transport=info
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./media:/media:ro
      - ./kausway-data:/kausway-data
