<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kausway administration</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><h1>Kausway administration</h1><p id="message" role="status" aria-live="polite"></p>
<section id="setup" hidden><h2>Create administrator</h2><p>Use the local setup link or enter its token below. Setup links expire after 15 minutes.</p><form id="setup-form">
<label>Setup token<input name="token" autocomplete="off" type="password" required></label>
<label>Username<input name="username" autocomplete="username" maxlength="64" required></label>
<label>Password<input name="password" type="password" autocomplete="new-password" required></label>
<label>Confirm password<input name="confirm" type="password" autocomplete="new-password" required></label><button>Create administrator</button></form></section>
<section id="login" hidden><h2>Sign in</h2><form id="login-form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section>
<section id="account" hidden><h2>Administrator account</h2><p id="signed-in"></p><p>Manage your local administrator credentials.</p><button id="logout">Sign out</button>
<h3>Change credentials</h3><form id="password-form"><label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label><label>Username<input name="username" autocomplete="username" maxlength="64" required></label><label>New password<input name="password" type="password" autocomplete="new-password" required></label><label>Confirm new password<input name="confirm" type="password" autocomplete="new-password" required></label><button>Save credentials and sign out</button></form></section>
<noscript>Enable JavaScript to use local administration.</noscript></main></body></html>
